services:
  - type: web
    name: lebupara-thunder-club-api
    runtime: python
    rootDir: be
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PORT
        value: 10000
